<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Ceri">
  <!-- Background Badge -->
  <circle cx="100" cy="100" r="92" fill="#FFE3E3" opacity="0.4" />
  <circle cx="100" cy="100" r="88" fill="#FFF8E7" stroke="#FF6B6B" stroke-width="4" />

  <!-- Shadow below cherries -->
  <ellipse cx="76" cy="154" rx="22" ry="7" fill="#2B2B3A" opacity="0.12" />
  <ellipse cx="126" cy="154" rx="22" ry="7" fill="#2B2B3A" opacity="0.12" />

  <!-- Green Stems joined at top -->
  <path d="M 76 112 Q 88 66 116 46" stroke="#2B8A3E" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 124 116 Q 120 72 116 46" stroke="#2B8A3E" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Green Leaf at Join -->
  <path d="M 116 46 C 132 40, 146 48, 148 58 C 134 62, 122 56, 116 46 Z" fill="#51CF66" stroke="#2B8A3E" stroke-width="2" />

  <!-- Left Cherry (Glossy Red) -->
  <circle cx="76" cy="126" r="28" fill="#F03E3E" stroke="#C92A2A" stroke-width="3" />
  <!-- Left Cherry Highlight -->
  <ellipse cx="66" cy="116" rx="8" ry="12" transform="rotate(-30 66 116)" fill="#FFA8A8" opacity="0.7" />
  <circle cx="63" cy="112" r="3.5" fill="#FFFFFF" opacity="0.9" />
  <!-- Left Cherry Face -->
  <circle cx="72" cy="130" r="3" fill="#2B2B3A" />
  <circle cx="86" cy="130" r="3" fill="#2B2B3A" />
  <ellipse cx="67" cy="135" rx="3.5" ry="2" fill="#FF8787" />
  <ellipse cx="91" cy="135" rx="3.5" ry="2" fill="#FF8787" />
  <path d="M 76 136 Q 79 140 82 136" stroke="#2B2B3A" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Right Cherry (Glossy Red) -->
  <circle cx="126" cy="130" r="26" fill="#E03131" stroke="#C92A2A" stroke-width="3" />
  <!-- Right Cherry Highlight -->
  <ellipse cx="118" cy="120" rx="7" ry="10" transform="rotate(-25 118 120)" fill="#FFA8A8" opacity="0.7" />
  <circle cx="115" cy="116" r="3" fill="#FFFFFF" opacity="0.9" />
  <!-- Right Cherry Face -->
  <circle cx="122" cy="134" r="3" fill="#2B2B3A" />
  <circle cx="134" cy="134" r="3" fill="#2B2B3A" />
  <ellipse cx="117" cy="138" rx="3" ry="1.8" fill="#FF8787" />
  <ellipse cx="139" cy="138" rx="3" ry="1.8" fill="#FF8787" />
  <path d="M 125 139 Q 128 143 131 139" stroke="#2B2B3A" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Sparkles -->
  <circle cx="156" cy="88" r="3" fill="#FFD43B" />
  <circle cx="44" cy="110" r="2.5" fill="#FF8787" />
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Dadu">
  <!-- Background Badge -->
  <circle cx="100" cy="100" r="92" fill="#FFE3E3" opacity="0.4" />
  <circle cx="100" cy="100" r="88" fill="#FFF8E7" stroke="#FF8787" stroke-width="4" />

  <!-- Dice Drop Shadow -->
  <ellipse cx="100" cy="154" rx="46" ry="12" fill="#2B2B3A" opacity="0.12" />

  <!-- Isometric Dice -->
  <!-- Top Face -->
  <polygon points="100,50 144,72 100,94 56,72" fill="#FFFFFF" stroke="#FA5252" stroke-width="3" stroke-linejoin="round" />
  <!-- Left Face -->
  <polygon points="56,72 100,94 100,146 56,124" fill="#FFE3E3" stroke="#FA5252" stroke-width="3" stroke-linejoin="round" />
  <!-- Right Face -->
  <polygon points="100,94 144,72 144,124 100,146" fill="#FA5252" stroke="#E03131" stroke-width="3" stroke-linejoin="round" />

  <!-- Pips (Dots) -->
  <!-- Top Face: 3 dots -->
  <circle cx="100" cy="72" r="4.5" fill="#E03131" />
  <circle cx="80" cy="62" r="4.5" fill="#E03131" />
  <circle cx="120" cy="82" r="4.5" fill="#E03131" />

  <!-- Left Face: 2 dots -->
  <circle cx="78" cy="98" r="4.5" fill="#E03131" />
  <circle cx="78" cy="120" r="4.5" fill="#E03131" />

  <!-- Right Face: 5 dots (White dots on Red face) -->
  <circle cx="122" cy="120" r="4.5" fill="#FFFFFF" />
  <circle cx="112" cy="105" r="4.5" fill="#FFFFFF" />
  <circle cx="132" cy="105" r="4.5" fill="#FFFFFF" />
  <circle cx="112" cy="135" r="4.5" fill="#FFFFFF" />
  <circle cx="132" cy="135" r="4.5" fill="#FFFFFF" />

  <!-- Small star sparkles -->
  <circle cx="152" cy="54" r="3" fill="#FFD43B" />
  <circle cx="46" cy="60" r="2.5" fill="#FFA94D" />
</svg>


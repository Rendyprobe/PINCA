  <circle cx="148" cy="84" r="2.5" fill="#4DABF7" />
  <path d="M 58 98 L 60 104 L 66 106 L 60 108 L 58 114 L 56 108 L 50 106 L 56 104 Z" fill="#FFD43B" stroke="#F59F00" stroke-width="1.2" />

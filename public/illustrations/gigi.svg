  <circle cx="100" cy="100" r="88" fill="#FFF8E7" stroke="#339AF0" stroke-width="4" />

  <!-- Happy Tooth Base Body -->
  <path d="M 64 68 C 64 54, 80 50, 100 56 C 120 50, 136 54, 136 68 C 142 86, 144 116, 134 148 C 128 164, 116 162, 112 140 C 108 126, 104 126, 100 126 C 96 126, 92 126, 88 140 C 84 162, 72 164, 66 148 C 56 116, 58 86, 64 68 Z" fill="#FFFFFF" stroke="#339AF0" stroke-width="3.5" />


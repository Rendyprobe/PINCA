<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Kaki">
  <!-- Background Badge -->
  <circle cx="100" cy="100" r="92" fill="#E7F5FF" opacity="0.4" />
  <circle cx="100" cy="100" r="88" fill="#FFF8E7" stroke="#4DABF7" stroke-width="4" />

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="154" rx="55" ry="10" fill="#2B2B3A" opacity="0.1" />

  <!-- Legs (Socks in striped yellow/white) -->
  <!-- Left Leg -->
  <rect x="68" y="55" width="22" height="60" rx="10" fill="#FFD43B" stroke="#F59F00" stroke-width="2.5" />
  <rect x="68" y="70" width="22" height="8" fill="#FFFFFF" />
  <rect x="68" y="86" width="22" height="8" fill="#FFFFFF" />

  <!-- Right Leg -->
  <rect x="110" y="55" width="22" height="60" rx="10" fill="#FFD43B" stroke="#F59F00" stroke-width="2.5" />
  <rect x="110" y="70" width="22" height="8" fill="#FFFFFF" />
  <rect x="110" y="86" width="22" height="8" fill="#FFFFFF" />

  <!-- Left Sneaker / Shoe (Blue Cute Sneaker) -->
  <path d="M 52 142 C 52 118, 70 110, 88 110 C 94 110, 98 116, 98 126 C 98 138, 96 142, 96 142 Z" fill="#339AF0" stroke="#1864AB" stroke-width="3" />
  <!-- Left Shoe Toe Cap -->
  <path d="M 52 142 C 52 130, 62 124, 72 124 L 72 142 Z" fill="#FFFFFF" stroke="#1864AB" stroke-width="2" />
  <!-- Left Shoe Sole -->
  <rect x="50" y="140" width="48" height="8" rx="4" fill="#FFFFFF" stroke="#1864AB" stroke-width="2" />
  <!-- Shoelaces -->
  <line x1="80" y1="116" x2="90" y2="120" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="80" y1="124" x2="90" y2="128" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Right Sneaker / Shoe (Blue Cute Sneaker) -->
  <path d="M 148 142 C 148 118, 130 110, 112 110 C 106 110, 102 116, 102 126 C 102 138, 104 142, 104 142 Z" fill="#339AF0" stroke="#1864AB" stroke-width="3" />
  <!-- Right Shoe Toe Cap -->
  <path d="M 148 142 C 148 130, 138 124, 128 124 L 128 142 Z" fill="#FFFFFF" stroke="#1864AB" stroke-width="2" />
  <!-- Right Shoe Sole -->
  <rect x="102" y="140" width="48" height="8" rx="4" fill="#FFFFFF" stroke="#1864AB" stroke-width="2" />
  <!-- Shoelaces -->
  <line x1="120" y1="116" x2="110" y2="120" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="120" y1="124" x2="110" y2="128" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Footstep Motion Sparkles -->
  <circle cx="160" cy="120" r="3.5" fill="#4DABF7" />
  <circle cx="40" cy="120" r="3.5" fill="#FFA94D" />
</svg>


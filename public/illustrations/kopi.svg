<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Kopi">
  <!-- Background Badge -->
  <circle cx="100" cy="100" r="92" fill="#FFE8CC" opacity="0.4" />
  <circle cx="100" cy="100" r="88" fill="#FFF8E7" stroke="#FFA94D" stroke-width="4" />

  <!-- Shadow below saucer -->
  <ellipse cx="100" cy="158" rx="54" ry="10" fill="#2B2B3A" opacity="0.12" />

  <!-- Saucer (Piring Kecil) -->
  <ellipse cx="100" cy="150" rx="52" ry="12" fill="#FFFFFF" stroke="#FFA94D" stroke-width="3" />
  <ellipse cx="100" cy="148" rx="42" ry="8" fill="#FFF3BF" />

  <!-- Cup Handle -->
  <path d="M 126 102 C 150 102, 150 134, 126 134" stroke="#4DABF7" stroke-width="6" stroke-linecap="round" fill="none" />
  <path d="M 126 102 C 150 102, 150 134, 126 134" stroke="#1864AB" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Coffee Cup Body -->
  <path d="M 68 96 L 76 142 C 78 148, 122 148, 124 142 L 132 96 Z" fill="#4DABF7" stroke="#1864AB" stroke-width="3" />

  <!-- Cup Rim Oval -->
  <ellipse cx="100" cy="96" rx="32" ry="9" fill="#339AF0" stroke="#1864AB" stroke-width="2.5" />
  <!-- Coffee Liquid in Cup -->
  <ellipse cx="100" cy="96" rx="28" ry="7" fill="#6F4E37" />
  <!-- Coffee Foam Heart / Crema -->
  <path d="M 100 93 C 97 90, 93 92, 94 95 C 96 98, 100 100, 100 100 C 100 100, 104 98, 106 95 C 107 92, 103 90, 100 93 Z" fill="#FFE8CC" />

  <!-- Cute Face on Cup -->
  <circle cx="92" cy="120" r="3" fill="#FFFFFF" />
  <circle cx="108" cy="120" r="3" fill="#FFFFFF" />
  <!-- Rosy cheeks -->
  <ellipse cx="86" cy="125" rx="4" ry="2.5" fill="#FF8787" opacity="0.8" />
  <ellipse cx="114" cy="125" rx="4" ry="2.5" fill="#FF8787" opacity="0.8" />
  <!-- Smile -->
  <path d="M 97 126 Q 100 130 103 126" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Warm Steam rising with Love/Swirl -->
  <path d="M 92 82 Q 88 70 96 60 Q 104 50 96 42" stroke="#FFA94D" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 108 80 Q 114 68 106 58 Q 98 48 106 40" stroke="#FFA94D" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
</svg>


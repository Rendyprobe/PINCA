<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Mata">
  <!-- Background Badge -->
  <circle cx="100" cy="100" r="92" fill="#E7F5FF" opacity="0.4" />
  <circle cx="100" cy="100" r="88" fill="#FFF8E7" stroke="#339AF0" stroke-width="4" />

  <!-- Eyebrows (Neat, friendly eyebrows) -->
  <path d="M 52 74 Q 68 64 84 72" stroke="#5C3C1E" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 116 72 Q 132 64 148 74" stroke="#5C3C1E" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- Left Eye Sclera (White base) -->
  <path d="M 46 104 C 52 84, 82 84, 88 104 C 82 122, 52 122, 46 104 Z" fill="#FFFFFF" stroke="#339AF0" stroke-width="3" />
  <!-- Left Iris (Bright Blue Iris) -->
  <circle cx="67" cy="104" r="14" fill="#339AF0" stroke="#1864AB" stroke-width="2" />
  <!-- Left Pupil -->
  <circle cx="67" cy="104" r="8" fill="#2B2B3A" />
  <!-- Left Eye Sparkles / Catchlights -->
  <circle cx="64" cy="100" r="3.5" fill="#FFFFFF" />
  <circle cx="70" cy="107" r="1.8" fill="#FFFFFF" />

  <!-- Right Eye Sclera (White base) -->
  <path d="M 112 104 C 118 84, 148 84, 154 104 C 148 122, 118 122, 112 104 Z" fill="#FFFFFF" stroke="#339AF0" stroke-width="3" />
  <!-- Right Iris (Bright Blue Iris) -->
  <circle cx="133" cy="104" r="14" fill="#339AF0" stroke="#1864AB" stroke-width="2" />
  <!-- Right Pupil -->
  <circle cx="133" cy="104" r="8" fill="#2B2B3A" />
  <!-- Right Eye Sparkles / Catchlights -->
  <circle cx="130" cy="100" r="3.5" fill="#FFFFFF" />
  <circle cx="136" cy="107" r="1.8" fill="#FFFFFF" />

  <!-- Eyelashes / Cute Expression -->
  <path d="M 86 98 L 92 92" stroke="#2B2B3A" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 152 98 L 158 92" stroke="#2B2B3A" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cute Rosy Cheeks below eyes -->
  <ellipse cx="67" cy="128" rx="8" ry="4.5" fill="#FF8787" opacity="0.6" />
  <ellipse cx="133" cy="128" rx="8" ry="4.5" fill="#FF8787" opacity="0.6" />

  <!-- Sparkle stars around eyes -->
  <path d="M 96 116 L 100 106 L 104 116 L 114 120 L 104 124 L 100 134 L 96 124 L 86 120 Z" fill="#FFD43B" />
  <circle cx="38" cy="88" r="3" fill="#4DABF7" />
  <circle cx="162" cy="88" r="3" fill="#4DABF7" />
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Meja">
  <!-- Background Badge -->
  <circle cx="100" cy="100" r="92" fill="#FFE8CC" opacity="0.4" />
  <circle cx="100" cy="100" r="88" fill="#FFF8E7" stroke="#FFA94D" stroke-width="4" />

  <!-- Shadow below table legs -->
  <ellipse cx="64" cy="156" rx="10" ry="4" fill="#2B2B3A" opacity="0.15" />
  <ellipse cx="136" cy="156" rx="10" ry="4" fill="#2B2B3A" opacity="0.15" />
  <ellipse cx="78" cy="142" rx="7" ry="3" fill="#2B2B3A" opacity="0.1" />
  <ellipse cx="122" cy="142" rx="7" ry="3" fill="#2B2B3A" opacity="0.1" />

  <!-- Back Table Legs -->
  <rect x="76" y="104" width="8" height="38" rx="4" fill="#8C532B" />
  <rect x="118" y="104" width="8" height="38" rx="4" fill="#8C532B" />

  <!-- Front Table Legs -->
  <rect x="60" y="104" width="10" height="52" rx="5" fill="#B36B39" stroke="#703D1A" stroke-width="2" />
  <rect x="130" y="104" width="10" height="52" rx="5" fill="#B36B39" stroke="#703D1A" stroke-width="2" />

  <!-- Table Apron (Support under tabletop) -->
  <rect x="62" y="100" width="76" height="10" rx="3" fill="#CD7F4A" stroke="#703D1A" stroke-width="2" />

  <!-- Tabletop (Warm Wood Oval/Trapezoid) -->
  <ellipse cx="100" cy="100" rx="60" ry="18" fill="#E89B60" stroke="#703D1A" stroke-width="3.5" />
  <ellipse cx="100" cy="98" rx="56" ry="15" fill="#FFA94D" />

  <!-- Wood Grain Details -->
  <path d="M 60 97 Q 100 93 140 97" stroke="#E8590C" stroke-width="1.8" fill="none" opacity="0.6" />
  <path d="M 74 102 Q 100 99 126 102" stroke="#E8590C" stroke-width="1.5" fill="none" opacity="0.6" />

  <!-- Cute Small Flower Vase on Table -->
  <ellipse cx="100" cy="88" rx="7" ry="3" fill="#2B2B3A" opacity="0.15" />
  <path d="M 94 88 C 92 80, 96 76, 100 76 C 104 76, 108 80, 106 88 Z" fill="#4DABF7" stroke="#1971C2" stroke-width="1.8" />
  <!-- Daisy Flower -->
  <circle cx="100" cy="68" r="4" fill="#FFD43B" stroke="#F59F00" stroke-width="1.2" />
  <circle cx="94" cy="68" r="3.5" fill="#FFFFFF" />
  <circle cx="106" cy="68" r="3.5" fill="#FFFFFF" />
  <circle cx="100" cy="62" r="3.5" fill="#FFFFFF" />
  <circle cx="100" cy="74" r="3.5" fill="#FFFFFF" />
  <line x1="100" y1="74" x2="100" y2="78" stroke="#40C057" stroke-width="2" />
</svg>


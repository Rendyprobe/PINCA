<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Pipi">
  <!-- Background Badge -->
  <circle cx="100" cy="100" r="92" fill="#FFE3E3" opacity="0.4" />
  <circle cx="100" cy="100" r="88" fill="#FFF8E7" stroke="#FFA94D" stroke-width="4" />

  <!-- Child Face Base (Round Chubby Head) -->
  <circle cx="100" cy="102" r="54" fill="#FFDFC4" stroke="#FFA94D" stroke-width="3" />

  <!-- Ears -->
  <circle cx="46" cy="104" r="10" fill="#FFDFC4" stroke="#FFA94D" stroke-width="2.5" />
  <circle cx="154" cy="104" r="10" fill="#FFDFC4" stroke="#FFA94D" stroke-width="2.5" />

  <!-- Hair (Cute Brown Bangs) -->
  <path d="M 48 94 C 46 60, 68 48, 100 48 C 132 48, 154 60, 152 94 C 140 76, 120 74, 100 74 C 80 74, 60 76, 48 94 Z" fill="#5C3C1E" />
  <path d="M 68 76 Q 84 86 100 76 Q 116 86 132 76" stroke="#4A2E14" stroke-width="3" fill="none" />

  <!-- Happy Curved Eyes -->
  <path d="M 76 96 Q 86 86 96 96" stroke="#2B2B3A" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 104 96 Q 114 86 124 96" stroke="#2B2B3A" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Cute Nose -->
  <circle cx="100" cy="104" r="2.5" fill="#E0A370" />

  <!-- Big Rosy Glowing Cheeks (Focus: Pipi) -->
  <ellipse cx="68" cy="110" rx="14" ry="10" fill="#FF6B6B" opacity="0.75" />
  <ellipse cx="132" cy="110" rx="14" ry="10" fill="#FF6B6B" opacity="0.75" />
  <!-- Cheek Highlight Sparkles -->
  <circle cx="64" cy="108" r="3" fill="#FFFFFF" opacity="0.9" />
  <circle cx="128" cy="108" r="3" fill="#FFFFFF" opacity="0.9" />

  <!-- Happy Smile -->
  <path d="M 88 116 Q 100 130 112 116" stroke="#2B2B3A" stroke-width="3.5" stroke-linecap="round" fill="#FA5252" />
  <path d="M 92 117 Q 100 122 108 117" fill="#FFFFFF" />

  <!-- Little decorative hearts / stars near cheeks -->
  <path d="M 40 82 Q 44 76 48 80 Q 52 76 56 82 Q 48 90 40 82 Z" fill="#FF8787" />
  <path d="M 144 82 Q 148 76 152 80 Q 156 76 160 82 Q 152 90 144 82 Z" fill="#FF8787" />
</svg>


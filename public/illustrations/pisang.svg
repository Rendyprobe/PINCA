<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Pisang">
  <!-- Background Badge -->
  <circle cx="100" cy="100" r="92" fill="#FFF3BF" opacity="0.4" />
  <circle cx="100" cy="100" r="88" fill="#FFF8E7" stroke="#FAB005" stroke-width="4" />

  <!-- Shadow below banana -->
  <ellipse cx="100" cy="156" rx="50" ry="10" fill="#2B2B3A" opacity="0.12" />

  <!-- Banana Stem (Top Cap) -->
  <path d="M 64 68 C 60 58, 64 50, 72 46 L 76 56 Z" fill="#5C3C1E" stroke="#3D291E" stroke-width="2" />

  <!-- Main Banana Body (Curved Crescent Yellow Banana) -->
  <path d="M 72 54 C 54 82, 54 130, 114 150 C 144 158, 154 140, 150 134 C 146 128, 134 138, 110 132 C 76 120, 70 88, 76 56 Z" fill="#FFD43B" stroke="#E67700" stroke-width="3.5" />

  <!-- Banana Ridge Highlights -->
  <path d="M 74 60 C 62 86, 62 124, 112 142" stroke="#FFF3BF" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 76 56 C 84 84, 94 116, 148 134" stroke="#FAB005" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Banana Tip (Bottom Tip Brown) -->
  <path d="M 148 134 C 152 136, 154 142, 150 144 Z" fill="#5C3C1E" />

  <!-- Cute Smiling Face on Banana -->
  <circle cx="86" cy="104" r="3.5" fill="#2B2B3A" />
  <circle cx="104" cy="116" r="3.5" fill="#2B2B3A" />
  <!-- Rosy Cheeks -->
  <ellipse cx="80" cy="110" rx="5" ry="3.5" fill="#FF8787" opacity="0.7" />
  <ellipse cx="108" cy="122" rx="5" ry="3.5" fill="#FF8787" opacity="0.7" />
  <!-- Smile -->
  <path d="M 90 113 Q 96 118 101 115" stroke="#2B2B3A" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Sparkles -->
  <circle cx="152" cy="74" r="3.5" fill="#FFA94D" />
  <circle cx="52" cy="126" r="2.5" fill="#FFD43B" />
</svg>


  <circle cx="100" cy="100" r="92" fill="#FFE8CC" opacity="0.4" />
  <circle cx="100" cy="100" r="88" fill="#FFF8E7" stroke="#FFA94D" stroke-width="4" />

  <!-- Shadow below bread -->
  <ellipse cx="100" cy="156" rx="50" ry="10" fill="#2B2B3A" opacity="0.12" />

  <!-- Back Toast Slice -->
  <path d="M 64 68 C 64 56, 82 50, 96 56 C 110 50, 128 56, 128 68 C 132 82, 134 130, 128 140 C 122 144, 70 144, 64 140 C 58 130, 60 82, 64 68 Z" fill="#D9480F" />
  <path d="M 68 70 C 68 60, 84 54, 96 60 C 108 54, 124 60, 124 70 C 128 82, 130 126, 124 136 C 120 140, 72 140, 68 136 C 62 126, 64 82, 68 70 Z" fill="#FFD8A8" />

  <!-- Front Toast Slice (Angled slightly) -->
  <path d="M 72 74 C 72 62, 90 56, 104 62 C 118 56, 136 62, 136 74 C 140 88, 142 136, 136 146 C 130 150, 78 150, 72 146 C 66 136, 68 88, 72 74 Z" fill="#E8590C" stroke="#D9480F" stroke-width="3" />
  <!-- Bread Crust Border -->
  <path d="M 76 76 C 76 66, 92 60, 104 66 C 116 60, 132 66, 132 76 C 136 88, 138 132, 132 142 C 128 146, 80 146, 76 142 C 70 132, 72 88, 76 76 Z" fill="#FFE8CC" />

  <!-- Yummy Jam / Butter Pat in Center (Red Strawberry Jam heart) -->

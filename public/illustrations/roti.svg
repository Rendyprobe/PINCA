  <!-- Jam Gloss -->
  <circle cx="98" cy="92" r="2.5" fill="#FFFFFF" opacity="0.8" />

  <!-- Cute Face on Toast -->
  <circle cx="92" cy="122" r="3.5" fill="#5C3C1E" />
  <circle cx="116" cy="122" r="3.5" fill="#5C3C1E" />
  <!-- Rosy cheeks -->
  <ellipse cx="85" cy="127" rx="5" ry="3" fill="#FF8787" opacity="0.7" />
  <ellipse cx="123" cy="127" rx="5" ry="3" fill="#FF8787" opacity="0.7" />
  <!-- Smile -->
  <path d="M 99 128 Q 104 134 109 128" stroke="#5C3C1E" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Little crumbs and sparkles -->
  <circle cx="148" cy="144" r="2.5" fill="#FFA94D" />
  <circle cx="154" cy="148" r="1.8" fill="#FFA94D" />
  <circle cx="58" cy="142" r="2.2" fill="#FFA94D" />
  <circle cx="146" cy="72" r="3" fill="#FFD43B" />
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Sapi">
  <!-- Background Badge -->
  <circle cx="100" cy="100" r="92" fill="#EBFBEE" opacity="0.4" />
  <circle cx="100" cy="100" r="88" fill="#FFF8E7" stroke="#40C057" stroke-width="4" />

  <!-- Little Horns -->
  <path d="M 66 64 C 62 52, 70 46, 76 56 Z" fill="#FFA94D" stroke="#D9480F" stroke-width="2" />
  <path d="M 134 64 C 138 52, 130 46, 124 56 Z" fill="#FFA94D" stroke="#D9480F" stroke-width="2" />

  <!-- Cow Ears (Floppy Cute Ears) -->
  <ellipse cx="52" cy="74" rx="16" ry="10" transform="rotate(-20 52 74)" fill="#FFFFFF" stroke="#2B2B3A" stroke-width="2.5" />
  <ellipse cx="52" cy="74" rx="10" ry="6" transform="rotate(-20 52 74)" fill="#FFC9C9" />

  <ellipse cx="148" cy="74" rx="16" ry="10" transform="rotate(20 148 74)" fill="#2B2B3A" stroke="#2B2B3A" stroke-width="2.5" />
  <ellipse cx="148" cy="74" rx="10" ry="6" transform="rotate(20 148 74)" fill="#FFC9C9" />

  <!-- Cow Head / Body Base -->
  <circle cx="100" cy="92" r="46" fill="#FFFFFF" stroke="#2B2B3A" stroke-width="3" />

  <!-- Black Spot Patches on Head -->
  <path d="M 72 54 C 62 70, 76 86, 60 96 C 54 84, 56 66, 72 54 Z" fill="#2B2B3A" />
  <path d="M 124 58 C 142 66, 136 88, 146 94 C 144 80, 140 64, 124 58 Z" fill="#2B2B3A" />

  <!-- Forehead Hair Tuft -->
  <ellipse cx="100" cy="54" rx="10" ry="6" fill="#FFFFFF" stroke="#2B2B3A" stroke-width="2" />

  <!-- Sparkling Cow Eyes -->
  <circle cx="80" cy="84" r="6" fill="#2B2B3A" />
  <circle cx="120" cy="84" r="6" fill="#2B2B3A" />
  <circle cx="78" cy="82" r="2" fill="#FFFFFF" />
  <circle cx="118" cy="82" r="2" fill="#FFFFFF" />

  <!-- Big Pink Cute Snout / Muzzle -->
  <ellipse cx="100" cy="118" rx="34" ry="22" fill="#FFC9C9" stroke="#E03131" stroke-width="3" />

  <!-- Nostrils -->
  <ellipse cx="88" cy="116" rx="5" ry="6" fill="#C92A2A" />
  <ellipse cx="112" cy="116" rx="5" ry="6" fill="#C92A2A" />

  <!-- Gentle Smile -->
  <path d="M 94 128 Q 100 134 106 128" stroke="#2B2B3A" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Rosy Cheeks -->
  <ellipse cx="64" cy="110" rx="8" ry="5" fill="#FF8787" opacity="0.6" />
  <ellipse cx="136" cy="110" rx="8" ry="5" fill="#FF8787" opacity="0.6" />

  <!-- Yellow Bell around Neck with Red Ribbon -->
  <path d="M 82 144 Q 100 152 118 144" stroke="#E03131" stroke-width="6" stroke-linecap="round" fill="none" />
  <!-- Golden Bell -->
  <path d="M 94 146 L 106 146 L 109 158 L 91 158 Z" fill="#FFD43B" stroke="#F59F00" stroke-width="2" />
  <circle cx="100" cy="160" r="3" fill="#F59F00" />
</svg>


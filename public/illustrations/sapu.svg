<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Sapu">
  <!-- Background Badge -->
  <circle cx="100" cy="100" r="92" fill="#FFF3BF" opacity="0.4" />
  <circle cx="100" cy="100" r="88" fill="#FFF8E7" stroke="#FAB005" stroke-width="4" />

  <!-- Shadow below broom -->
  <ellipse cx="100" cy="162" rx="42" ry="8" fill="#2B2B3A" opacity="0.1" />

  <!-- Broom Handle (Wooden Stick slanted) -->
  <line x1="135" y1="42" x2="95" y2="124" stroke="#845EF7" stroke-width="8" stroke-linecap="round" />
  <line x1="135" y1="42" x2="95" y2="124" stroke="#5F3DC4" stroke-width="2" stroke-linecap="round" />

  <!-- Handle Top Cap -->
  <circle cx="135" cy="42" r="6" fill="#D0BFFF" stroke="#5F3DC4" stroke-width="2" />

  <!-- Bristle Cap / Tie (Orange Ribbon with Bow) -->
  <ellipse cx="94" cy="126" rx="14" ry="7" transform="rotate(-25 94 126)" fill="#FF922B" stroke="#D9480F" stroke-width="2.5" />
  <!-- Bow Tie -->
  <circle cx="94" cy="126" r="3.5" fill="#FFE066" />
  <path d="M 94 126 Q 88 120 86 128 Z" fill="#FFA94D" />
  <path d="M 94 126 Q 100 132 102 124 Z" fill="#FFA94D" />

  <!-- Broom Bristles (Straw Fan / Yellow Bristles) -->
  <path d="M 82 132 L 60 162 C 72 166, 116 166, 126 150 L 105 122 Z" fill="#FFD43B" stroke="#F59F00" stroke-width="3" stroke-linejoin="round" />

  <!-- Bristle Detail Lines -->
  <line x1="88" y1="135" x2="74" y2="162" stroke="#F59F00" stroke-width="2" stroke-linecap="round" />
  <line x1="94" y1="135" x2="92" y2="164" stroke="#F59F00" stroke-width="2" stroke-linecap="round" />
  <line x1="100" y1="133" x2="110" y2="158" stroke="#F59F00" stroke-width="2" stroke-linecap="round" />

  <!-- Sparkles / Clean stars -->
  <path d="M 52 140 L 55 146 L 61 148 L 55 150 L 52 156 L 49 150 L 43 148 L 49 146 Z" fill="#4DABF7" />
  <circle cx="140" cy="120" r="3" fill="#FFD43B" />
  <circle cx="62" cy="116" r="2.5" fill="#FFA94D" />
</svg>


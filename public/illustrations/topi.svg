<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Topi">
  <!-- Background Badge -->
  <circle cx="100" cy="100" r="92" fill="#FFF3BF" opacity="0.4" />
  <circle cx="100" cy="100" r="88" fill="#FFF8E7" stroke="#FFA94D" stroke-width="4" />

  <!-- Shadow below hat -->
  <ellipse cx="100" cy="148" rx="60" ry="12" fill="#2B2B3A" opacity="0.12" />

  <!-- Baseball Cap Crown (Dome) -->
  <path d="M 54 126 C 54 74, 80 60, 116 60 C 136 60, 148 76, 148 126 Z" fill="#FFA94D" stroke="#E8590C" stroke-width="3.5" />

  <!-- Cap Crown Front Panel Contrast -->
  <path d="M 80 126 C 80 78, 98 64, 116 64 C 132 64, 144 76, 144 126 Z" fill="#FFE066" stroke="#E8590C" stroke-width="2.5" />

  <!-- Cap Seams -->
  <path d="M 116 60 L 116 126" stroke="#E8590C" stroke-width="2.5" stroke-dasharray="3 3" />
  <path d="M 116 60 Q 86 90 70 126" stroke="#E8590C" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Top Button -->
  <ellipse cx="116" cy="60" rx="7" ry="4" fill="#339AF0" stroke="#1864AB" stroke-width="2" />

  <!-- Cap Visor / Brim (Curved Forward to the Left) -->
  <path d="M 54 126 C 40 126, 26 130, 24 136 C 24 144, 46 148, 88 144 C 132 140, 146 132, 148 126 C 132 124, 76 122, 54 126 Z" fill="#339AF0" stroke="#1864AB" stroke-width="3.5" />

  <!-- Visor Highlight Stitching -->
  <path d="M 32 136 C 46 142, 86 140, 126 134" stroke="#D0EBFF" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="3 2" />

  <!-- Cute Star Badge on Cap -->
  <polygon points="122,86 124,93 131,93 125,98 127,105 122,101 117,105 119,98 113,93 120,93" fill="#FFFFFF" stroke="#E8590C" stroke-width="1.5" />
</svg>


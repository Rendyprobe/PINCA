<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Wortel">
  <!-- Background Badge -->
  <circle cx="100" cy="100" r="92" fill="#FFE8CC" opacity="0.4" />
  <circle cx="100" cy="100" r="88" fill="#FFF8E7" stroke="#FFA94D" stroke-width="4" />

  <!-- Shadow below carrot -->
  <ellipse cx="100" cy="162" rx="42" ry="8" fill="#2B2B3A" opacity="0.12" />

  <!-- Green Carrot Leaves (Feathery Tops) -->
  <path d="M 100 70 C 88 44, 76 46, 80 36 C 88 42, 94 56, 98 70 Z" fill="#40C057" stroke="#2B8A3E" stroke-width="2" />
  <path d="M 100 70 C 96 38, 104 30, 104 30 C 108 40, 104 54, 102 70 Z" fill="#51CF66" stroke="#2B8A3E" stroke-width="2" />
  <path d="M 100 70 C 112 44, 124 46, 120 36 C 112 42, 106 56, 102 70 Z" fill="#40C057" stroke="#2B8A3E" stroke-width="2" />

  <!-- Carrot Cone Body (Bright Orange) -->
  <path d="M 72 74 C 74 66, 126 66, 128 74 C 128 92, 108 148, 100 162 C 92 148, 72 92, 72 74 Z" fill="#FF922B" stroke="#E8590C" stroke-width="3.5" />

  <!-- Carrot Highlight -->
  <path d="M 78 76 C 80 72, 92 70, 94 76 C 90 102, 84 130, 96 150 C 88 136, 76 102, 78 76 Z" fill="#FFB86C" />

  <!-- Carrot Texture Grooves / Lines -->
  <line x1="78" y1="88" x2="94" y2="88" stroke="#E8590C" stroke-width="2.5" stroke-linecap="round" />
  <line x1="106" y1="98" x2="122" y2="98" stroke="#E8590C" stroke-width="2.5" stroke-linecap="round" />
  <line x1="82" y1="112" x2="96" y2="112" stroke="#E8590C" stroke-width="2.5" stroke-linecap="round" />
  <line x1="102" y1="126" x2="114" y2="126" stroke="#E8590C" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cute Face on Carrot -->
  <circle cx="92" cy="84" r="3" fill="#2B2B3A" />
  <circle cx="108" cy="84" r="3" fill="#2B2B3A" />
  <!-- Rosy cheeks -->
  <ellipse cx="86" cy="89" rx="4.5" ry="2.8" fill="#FF6B6B" opacity="0.7" />
  <ellipse cx="114" cy="89" rx="4.5" ry="2.8" fill="#FF6B6B" opacity="0.7" />
  <!-- Smile -->
  <path d="M 97 90 Q 100 95 103 90" stroke="#2B2B3A" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>

